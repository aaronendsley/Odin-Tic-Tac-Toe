<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div id="game-container">
        <h1>TIC TAC TOE</h1>
        <div id="players">
            <div id="player1" class="player">
                <h2 id="player1_name"></h2>
                <p id="player1_score"></p>
            </div>
            <div id="player2" class="player">
                <h2 id="player2_name"></h2>
                <p id="player2_score"></p>
            </div>
        </div>
        <!-- Your game content goes here -->
        <div id="gameboard">
            <div class="square" data-cell="0"></div>
            <div class="square" data-cell="1"></div>
            <div class="square" data-cell="2"></div>
            <div class="square" data-cell="3"></div>
            <div class="square" data-cell="4"></div>
            <div class="square" data-cell="5"></div>
            <div class="square" data-cell="6"></div>
            <div class="square" data-cell="7"></div>
            <div class="square" data-cell="8"></div>
        </div>
        <p id="message"></p>
    </div>
    <div id="get_user_names">
        <p>Who will be playing the game</p>
        <form id="userForm">
          <div>
            <label for="player_one_name">Player One:</label>
            <input type="text" id="player_one_name" name="player_one_name" required>
          </div>

          <div>
            <label for="playerTwoName">Player Two:</label>
            <input type="text" id="playerTwoName" name="playerTwoName" required>
          </div>

          <button type="button">Play The Game</button>
        </form>

    </div>

    <script src="index.js" defer></script>
</body>
</html>
